<text x="480" y="518.5" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#566A71">un sì; any nelle domande aperte e</text>
<text x="480" y="541.75" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#566A71">nelle negative.</text>
