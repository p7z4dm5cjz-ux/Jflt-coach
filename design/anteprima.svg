<text x="494" y="801" font-family="DejaVu Serif" font-size="16" font-weight="400" fill="#17343D">Would you like some help?</text>
<text x="480" y="850.0" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#566A71">Domanda aperta oppure offerta di aiuto:</text>
